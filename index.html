<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock</title>
<style>
  :root {
    --bg: #f5f3fa; --fg: #17141f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0a10; --fg: #f2f0fa; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0b0a10; --fg: #f2f0fa; color-scheme: dark; }
  html { height: 100%; }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #time {
    font-size: clamp(64px, 24vw, 220px); font-weight: 700; letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="time">--:--</div>
<script>
  var el = document.getElementById('time');
  var pad = function (n) { return String(n).padStart(2, '0'); };
  // use the device's own time zone
  var tz;
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
  function tick() {
    var now = new Date();
    var parts;
    try {
      parts = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: tz }).formatToParts(now);
    } catch (e) { parts = null; }
    if (parts) {
      var h = parts.filter(function (p) { return p.type === 'hour'; })[0].value;
      var m = parts.filter(function (p) { return p.type === 'minute'; })[0].value;
      el.textContent = h + ':' + m;
    } else {
      el.textContent = (now.getHours() % 12 || 12) + ':' + pad(now.getMinutes());
    }
    setTimeout(tick, 1000 - now.getMilliseconds());
  }
  tick();
</script>
</body>
</html>
